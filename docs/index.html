<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessibility exercise</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f8;
      color: #222222;
      margin: 0;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    main {
      width: 100%;
      max-width: 510px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header */
    h1 {
      color: #165b53;
      margin-bottom: 10px;
      text-align: center;
    }

    h2 {
      color: #165b53;
      margin-bottom: 20px;
      text-align: center;
    }

    /* Visually hides text while keeping it in the accessibility tree */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Form container */
    form {
      background-color: #ffffff;
      padding: 25px 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      max-width: 450px;
      width: 100%;
      box-sizing: border-box;
    }

    /* Fieldset and legend */
    fieldset {
      border: 2px solid #165b53;
      border-radius: 8px;
      padding: 20px;
    }

    legend {
      font-weight: bold;
      color: #264653;
      padding: 0 10px;
    }

    /* Form controls */
    .form-control {
      display: flex;
      flex-direction: column;
      margin-bottom: 15px;
    }

    label {
      margin-bottom: 6px;
      font-weight: 500;
      color: #264653;
      font-size: 1.1em;
      align-self: flex-start;
      cursor: pointer;
    }

    /* Inputs and textarea */
    input[type="text"],
    input[type="email"],
    textarea {
      padding: 10px;
      border: 2px solid #595959;
      border-radius: 6px;
      font-size: 1em;
      font-family: inherit;
      color: #222222;
      background-color: #ffffff;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    textarea:focus,
    input[type="submit"]:focus,
    button[type="submit"]:focus {
      border-color: #165b53;
      box-shadow: 0 0 5px rgba(22, 91, 83, 0.4);
      outline: 2px solid #165b53;
      outline-offset: 2px;
    }

    /* Submit button */
    input[type="submit"],
    button[type="submit"] {
      background-color: #165b53;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 1em;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    input[type="submit"]:hover,
    button[type="submit"]:hover {
      background-color: #0f423c;
    }

    /* Contact info */
    .contact-info {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 25px;
      color: #222222;
    }

    .contact-info img {
      width: 20px;
      height: 20px;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Accessibility exercises</h1>
  </header>

  <main>
    <h2>ARIA exercise 1 (after)</h2>

    <form action="" method="get" onsubmit="event.preventDefault();">
      <fieldset>
        <legend>Contact us</legend>

        <div class="form-control">
          <label for="name">
            <i class="fa-solid fa-user" aria-hidden="true"></i>
            <span class="sr-only">Name</span>
          </label>
          <input type="text" id="name" name="name" autocomplete="name" />
        </div>

        <div class="form-control">
          <label for="email">
            <i class="fa-solid fa-envelope" aria-hidden="true"></i>
            <span class="sr-only">e-mail</span>
          </label>
          <input type="email" id="email" name="email" autocomplete="email" />
        </div>

        <div class="form-control">
          <label for="message">
            <i class="fa-solid fa-message" aria-hidden="true"></i>
            <span class="sr-only">Message</span>
          </label>
          <textarea id="message" name="message" cols="30" rows="10"></textarea>
        </div>

        <button type="submit" aria-label="Send">Send</button>
      </fieldset>
    </form>

    <p class="contact-info">
      <img alt="Phone" src="https://img.icons8.com/small/2x/phone.png" />
      <span>+52 (333) 45 34 567</span>
    </p>
  </main>
</body>
</html>
